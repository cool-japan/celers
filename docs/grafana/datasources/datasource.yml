# Grafana datasource provisioning for the local development stack in
# ../../docker-compose.yml. Mounted read-only at
# /etc/grafana/provisioning/datasources/datasource.yml (the compose file
# mounts ./docs/grafana as /etc/grafana/provisioning).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

queues = ["celers"]

[broker]
type = "redis"
url = "redis://localhost:6379"
failover_urls = []
failover_retries = 3
failover_timeout_secs = 5
queue = "celers"
mode = "fifo"

[worker]
concurrency = 4
poll_interval_ms = 1000
max_retries = 3
default_timeout_secs = 300

[pool]
max_size = 16
reuse_enabled = true

[cache]
ttl_secs = 30
enabled = true

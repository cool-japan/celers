[workspace]
members = [
    # Facade
    "crates/celers",

    # Core & Protocol (The "Vine" & "Celery Core" equivalent)
    "crates/celers-core",
    "crates/celers-protocol",

    # Messaging Layer (The "Kombu" equivalent)
    "crates/celers-kombu",
    "crates/celers-broker-redis",
    "crates/celers-broker-postgres",
    "crates/celers-broker-amqp",
    "crates/celers-broker-sqs",
    "crates/celers-broker-sql",

    # Result Backend Layer
    "crates/celers-backend-redis",
    "crates/celers-backend-db",
    "crates/celers-backend-rpc",

    # Runtime & Workflow (The "Billiard" & "Canvas" equivalent)
    "crates/celers-worker",
    "crates/celers-canvas",
    "crates/celers-beat",

    # Utilities
    "crates/celers-macros",
    "crates/celers-cli",
    "crates/celers-metrics",

    # Examples & benchmarks (publish = false).
    #
    # This crate was split out of the workspace once to keep routine builds
    # from compiling 15 examples and 3 benches. The cost of that was silent
    # rot: nothing at the repo root ever built it, so it drifted out of sync
    # with the APIs it demonstrates (it was found failing to compile, and
    # unformatted, while every workspace member was green). It is back in
    # `members` so `cargo build/clippy/fmt --workspace` covers it, and every
    # dependency version now inherits from `[workspace.dependencies]` instead
    # of being a copied literal that nothing keeps current.
    #
    # `cargo build --workspace` does not build example or bench targets, so
    # the extra cost lands only on `--all-targets` runs — which is exactly
    # where the drift needed to be caught.
    "crates/celers-examples",

    # A one-dependency crate (`celers` and nothing else) whose only job is to
    # prove that `#[celers::task]` expands for a downstream user of the facade
    # alone. Every other member depends on celers-core/async-trait/serde
    # directly, so none of them can catch a regression in the facade's
    # re-export surface. publish = false.
    "crates/celers-facade-test",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["COOLJAPAN OU (Team KitaSan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/celers"
# MINIMUM SUPPORTED RUST VERSION
#
# Not a wish: it is the maximum `rust-version` over everything this workspace
# actually compiles, and it is re-derivable read-only:
#
#   cargo metadata --format-version 1 --all-features
#
# then take `max(rust_version)` over the packages reachable from the workspace
# members through normal/build dependency edges. As of this release that is
# 1.89, set by the oxisql 0.4.1 chain (oxisql-core / -postgres / -mysql /
# -parse) and the oxitls 0.3.0 chain; lapin 4.10.0 and amq-protocol 10.6.3 sit
# just below at 1.88.
#
# TWO KNOWN EXCEPTIONS, both deliberate:
#
#   * `celers-broker-sqs` declares its own `rust-version = "1.94.1"`. Its
#     `aws-config` / `aws-sdk-sqs` / `aws-sdk-cloudwatch` dependencies are NOT
#     optional, so that whole crate — and therefore the `sqs` feature of the
#     `celers` facade, `--all-features`, and `celers/full` — requires 1.94.1
#     unconditionally. Inheriting 1.89 there would be a claim cargo contradicts
#     on the first build.
#
#   * Running the *test* suite of `celers-metrics` additionally needs 1.93.1,
#     from its `serial_test` 4.0.1 dev-dependency. Dev-dependencies do not
#     affect what a downstream user needs to build the crate, so this does not
#     move the published floor — but a contributor on exactly 1.89 will meet it.
#
# Re-derive this number whenever dependencies are bumped; it belongs on the
# release checklist next to `cargo deny check bans`.
rust-version = "1.89"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
oxicode = { version = "0.2.6", features = ["serde", "derive"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# Broker implementations
#
# REDIS TLS (`rediss://`). `tokio-rustls-comp` turns on the async rustls
# transport; `tls-rustls-webpki-roots` picks the trust store.
#
#   * `tls-rustls` (pulled in by `tokio-rustls-comp`) selects NO rustls crypto
#     provider feature — it is `["dep:rustls", "rustls/std",
#     "dep:rustls-native-certs"]`. That is what makes it composable with this
#     workspace's Pure-Rust `rustls-rustcrypto` stack, unlike lapin's default.
#
#   * ORDERING CONSTRAINT, identical to the lapin one documented below:
#     `redis`'s `create_rustls_config` calls the bare
#     `rustls::ClientConfig::builder()`, which panics unless a process-default
#     `CryptoProvider` is already installed. Both
#     `celers_broker_redis::install_pure_tls_provider()` and
#     `celers_backend_redis::install_pure_tls_provider()` install OxiTLS'
#     provider (via `std::sync::Once`), and every `redis::Client` this
#     workspace opens goes through an `open_client`/`build_client` helper that
#     calls one of them first. An application that builds rustls clients
#     through other libraries earlier in startup should call one itself, first
#     thing in `main`; whoever installs first wins.
#
#   * TRUST STORE: `tls-rustls-webpki-roots` makes `create_rustls_config` seed
#     its root store from the Mozilla bundle and — see the `cfg(all(...,
#     not(feature = "tls-rustls-webpki-roots")))` guard on its
#     `load_native_certs()` call — never touch the OS trust store. That keeps
#     `rediss://` off the ~12 s macOS Security-framework walk. A private Redis
#     CA is supplied per-connection instead, through
#     `RedisConfig::tls(TlsConfig::new().ca_cert(...))`, which routes to
#     `redis::Client::build_with_tls`.
#
#   * `rustls-native-certs` is still COMPILED (`tls-rustls` names it with
#     `dep:`, so there is no way to opt out) but is dead code at runtime under
#     `tls-rustls-webpki-roots`. It is Pure Rust plus the `security-framework`
#     bindings to the macOS system framework, and is not on `deny.toml`'s ban
#     list. Nothing in this workspace can drop it short of forking `redis`.
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager", "aio", "cluster-async", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
# NOTE: neither oxisql-postgres nor oxisql-mysql 0.3.2 exposes a `chrono`
# Cargo feature (confirmed against their published Cargo.toml manifests) —
# the `chrono`-gated `FromValue` impls (e.g. `DateTime<Utc>`) live in
# oxisql-core itself, so `chrono` is enabled here on oxisql-core directly;
# Cargo feature unification turns the impls on for every crate in the build
# graph that references `oxisql_core::Row`/`FromValue`, including
# oxisql-postgres/oxisql-mysql row decoding.
oxisql-core = { version = "0.4.1", features = ["chrono"] }
oxisql-postgres = "0.4.1"
oxisql-mysql = "0.4.1"
# Pure-Rust TLS facade (rustls + rustls-rustcrypto).
# Depended on with the exact same feature set oxisql-postgres itself uses
# internally (see its Cargo.toml), so the `Arc<rustls::ClientConfig>`
# produced by `oxitls::client_config` is guaranteed compatible with
# `oxisql_postgres::TlsMode::Rustls` / `oxisql_mysql::TlsMode::Rustls`.
oxitls = { version = "0.3.0", default-features = false, features = ["pure", "webpki-roots"] }
# Named directly (not just pulled in transitively via oxitls/oxisql-*) so
# `celers-cli`'s `tls_mode.rs` can name `rustls::ClientConfig` in its public
# API. Same version/feature pin as oxitls/oxisql's own Cargo.toml.
#
# SCOPE OF THE `default-features = false` CLAIM — read before relying on it:
# it keeps rustls' own default `aws-lc-rs` backend off for THIS declaration
# only. Cargo unifies features per *package*, not per dependency declaration,
# so any other crate in the same build that enables `rustls/aws_lc_rs` or
# `rustls/ring` turns it on for everybody. The Pure-Rust surface is therefore
# a property of the *feature set being built*, not of this line:
#
#   * Pure Rust today: EVERY workspace member, `celers-broker-sqs` included.
#     (`celers-broker-amqp` joined that set once `lapin` was pinned to
#     `default-features = false` + `rustls-webpki-roots-certs`, below;
#     `celers-broker-sqs` joined it once `default-https-client` came off the
#     three AWS SDK declarations and `celers_broker_sqs::pure_http` took over
#     the transport.)
#   * CONSEQUENCE — no rustls provider feature is enabled anywhere in this
#     workspace any more. `rustls::ClientConfig::builder()` auto-selects a
#     provider only when EXACTLY ONE provider feature is on; with none, it
#     panics unless a process default was installed first. Every bare-builder
#     path in the graph is therefore covered by an
#     `install_pure_tls_provider()` call — see the lapin and redis notes.
#
# Verify with `cargo tree -e features -i aws-lc-sys --all-features` (must
# report "did not match any packages"); enforced mechanically by `deny.toml`,
# whose `[graph] exclude` is now empty.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
# `default-features = false` is load-bearing and MUST live here, at the
# workspace level: a member-level `default-features = false` on an inherited
# dependency is silently ignored by Cargo unless the workspace entry also
# specifies it (verified against Cargo 1.95).
#
# lapin's default feature set is `["rustls", "default-runtime"]`, and
# `rustls` resolves to `amq-protocol-tcp/rustls` =
# `["rustls-platform-verifier", "rustls--aws_lc_rs"]` — i.e. it hard-selects
# the FFI-backed `aws-lc-rs` provider (C/C++/asm via `aws-lc-sys`). Selecting
# `rustls-webpki-roots-certs` instead keeps rustls/`rustls-connector` but with
# NO built-in provider feature, which lets the Pure-Rust `rustls-rustcrypto`
# provider that `celers_broker_amqp::install_pure_tls_provider()` installs as
# the process default serve the AMQPS handshake.
#
# ORDERING CONSTRAINT: with no built-in provider, a bare
# `rustls::ClientConfig::builder()` panics unless a default provider is
# already installed. Audited: the only bare builder reachable in this
# workspace's graph is `rustls-connector` (lapin's TLS layer), and both
# `AmqpBroker::with_config` and `connect::open_connection` call
# `install_pure_tls_provider()` (via `std::sync::Once`) before it can run.
# `oxitls` and `oxihttp-client` are safe by construction — every one of their
# rustls configs goes through `ClientConfig::builder_with_provider`, and
# oxitls' own docs state it never calls `install_default()` (verified by
# grepping both crates' sources for `ClientConfig::builder()`: no hits).
#
# An application that builds rustls clients through *other* libraries before
# constructing an `AmqpBroker` should call
# `celers_broker_amqp::install_pure_tls_provider()` itself, first thing in
# `main`; whoever installs a default provider first wins.
#
# TRUST STORE: webpki roots replace the OS/corporate trust store. Deployments
# with a private RabbitMQ CA should enable `celers-broker-amqp/tls-native-certs`,
# which adds `lapin/rustls-native-certs` (Pure Rust) on top.
lapin = { version = "4.10.0", default-features = false, features = ["default-runtime", "rustls-webpki-roots-certs"] }
oxihttp-client = { version = "0.2.1", features = ["tls"] }
# `oxihttp_core::Body` / `Bytes` — the request-body type `Client::execute_body`
# takes. `oxihttp-client` does not re-export it, and it is already in the graph
# (oxihttp-client depends on exactly this version), so naming it adds no crate.
oxihttp-core = "0.2.1"
http = "1.5.0"
# `BodyExt::collect`, used by `celers_broker_sqs::pure_http` to drain an
# `SdkBody` request body into memory before handing it to oxihttp. Already in
# the graph via oxihttp-client / tonic / the AWS SDK.
http-body-util = "0.1.5"

# AWS SDK
#
# `default-features = false` is load-bearing, not tidiness: the SDK crates'
# default feature set contains `rustls`, which resolves to
# `aws-smithy-runtime/tls-rustls` -> `aws-smithy-http-client/legacy-rustls-ring`
# + `connector-hyper-0-14-x`. That single feature was the *only* source of
# rustls 0.21 / rustls-webpki 0.101 / hyper 0.14 / h2 0.3 / tokio-rustls 0.24 /
# hyper-rustls 0.24 / `ring` in the whole lockfile — i.e. four open RUSTSEC
# advisories (RUSTSEC-2026-0258, -0104, -0098, -0099) and seven duplicate
# version pairs — for a hyper-0.14 connector that `celers-broker-sqs` never
# constructs.
#
# `default-https-client` is NOT enabled either, and that is the whole
# Pure-Rust SQS story. It resolves to
# `aws-smithy-runtime/default-https-client` ->
# `aws-smithy-http-client/rustls-aws-lc` -> `aws-lc-rs` -> `aws-lc-sys`
# (vendored C/C++/asm built with cmake+cc). `aws-smithy-http-client`'s only
# other TLS options are `rustls-ring`, `rustls-aws-lc-fips` and `s2n-tls`, all
# C/asm, so there is no feature combination of the stock client that satisfies
# the Pure-Rust policy. With the feature off, `aws-smithy-http-client` is
# unreachable and leaves the graph entirely.
#
# HTTPS then comes from `celers_broker_sqs::pure_http`: an
# `aws_smithy_runtime_api` `HttpClient`/`HttpConnector` implemented over
# `oxihttp-client` (hyper 1.x + tokio-rustls + OxiTLS' `rustls-rustcrypto`
# provider), installed with `aws_config::defaults(..).http_client(..)` at
# `broker_core.rs`'s `get_client` / `get_cloudwatch_client`. It is behind
# `celers-broker-sqs`'s default-on `pure-http` feature; turning that off leaves
# HTTP client selection to the application, which must then supply one (e.g. by
# enabling `aws-config/default-https-client` in ITS OWN manifest — a workspace
# feature cannot offer that, because `deny.toml` checks with
# `[graph] all-features = true` and would see the FFI stack come back).
#
# `behavior-version-latest` is deliberately NOT enabled:
# `crates/celers-broker-sqs/src/broker_core.rs` passes
# `BehaviorVersion::latest()` explicitly at every `aws_config::defaults` call.
aws-config = { version = "1.11.0", default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-sdk-sqs = { version = "1.107.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-cloudwatch = { version = "1.126.0", default-features = false, features = ["rt-tokio"] }
# The `HttpClient` / `HttpConnector` / `HttpConnectorSettings` /
# `SharedHttpConnector` traits and types `celers_broker_sqs::pure_http`
# implements, and that `src/test_support.rs` uses for its offline unit-test
# client. `aws-sdk-sqs::config` re-exports `HttpClient` and `SharedHttpClient`
# but not `HttpConnectorSettings` or `SharedHttpConnector`, so neither can be
# written against the SDK's own re-exports alone.
#
# Already in the graph transitively — `aws-sdk-sqs` depends on exactly this
# version — so naming it here adds no crate to the build. `client` gates the
# whole `aws_smithy_runtime_api::client` module tree; `http-1x` gates
# `Request::try_into_http1x` and `TryFrom<http_1x::Response<B>>`, the two
# conversions the connector is built on. Both were previously turned on
# transitively by `aws-smithy-http-client/default-client`, which is gone.
aws-smithy-runtime-api = { version = "1.15.0", features = ["client", "http-1x"] }
# `SdkBody`, the body type on both sides of `HttpConnector::call`. Same
# reasoning: already in the graph at exactly this version via the SDK.
aws-smithy-types = "1.6.2"

# CLI and utilities
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
uuid = { version = "1.25.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
hostname = "0.4.2"
regex = "1.13.1"
rand = "0.10.2"
oxiarc-deflate = "0.4.1"
oxiarc-zstd = "0.4.1"
crossbeam-deque = "0.8.7"
num_cpus = "1.17.0"
libc = "0.2.189"
base64 = "0.23.1"
hex = "0.4.3"

# gRPC dependencies
#
# TLS DECISION (celers-backend-rpc, audit idx 263) — recorded here because it
# is a workspace-level choice, not a per-crate one:
#
# tonic's own `tls-ring` / `tls-aws-lc` features unconditionally pull `ring`
# or `aws-lc-rs`, both banned by deny.toml, so neither is enabled and the
# gRPC result backend ships **without built-in TLS**. The workspace
# deliberately does NOT carve out a Pure-Rust policy exception for it.
#
# The supported path today is `GrpcResultBackend::from_channel_with_config`:
# the caller builds its own `tonic::transport::Channel` and hands it in.
#
# The path to built-in TLS, when someone takes it, is
# `Endpoint::connect_with_connector` over a `tokio-rustls` connector using the
# workspace's existing `rustls` + `rustls-rustcrypto` (via `oxitls`) stack.
# That needs `tokio-rustls`, `hyper-util` and `tower` added here plus a
# connector implementation in celers-backend-rpc; it is not added
# speculatively because an unused `[workspace.dependencies]` entry only rots.
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"

# Serialization formats
rmp-serde = "1.3.1"
# `serde_yaml` 0.9 is archived upstream (its newest release is literally
# `0.9.34+deprecated`) and it parses user-supplied config files in
# `celers-cli`. `serde_yaml_ng` is the maintained fork with the same
# `from_str`/`from_slice`/`to_string` surface. `serde_yaml` is banned by
# name in deny.toml so it cannot come back.
serde_yaml_ng = "0.10.0"
bson = { version = "3.1.0", features = ["serde"] }

# Crypto dependencies
hmac = "0.13.0"
sha2 = "0.11.0"
aes-gcm = "0.11.1"
chacha20poly1305 = "0.11.0"

# Hashing
twox-hash = "2.1.3"

# Scheduling dependencies
cron = "0.17.0"
sunrise = "3.0.0"

# Internal workspace crates
celers = { path = "crates/celers", version = "0.3.1" }
celers-backend-db = { path = "crates/celers-backend-db", version = "0.3.1" }
celers-backend-redis = { path = "crates/celers-backend-redis", version = "0.3.1" }
celers-backend-rpc = { path = "crates/celers-backend-rpc", version = "0.3.1" }
celers-beat = { path = "crates/celers-beat", version = "0.3.1" }
celers-broker-amqp = { path = "crates/celers-broker-amqp", version = "0.3.1" }
celers-broker-postgres = { path = "crates/celers-broker-postgres", version = "0.3.1" }
celers-broker-redis = { path = "crates/celers-broker-redis", version = "0.3.1" }
celers-broker-sql = { path = "crates/celers-broker-sql", version = "0.3.1" }
celers-broker-sqs = { path = "crates/celers-broker-sqs", version = "0.3.1" }
celers-canvas = { path = "crates/celers-canvas", version = "0.3.1" }
celers-core = { path = "crates/celers-core", version = "0.3.1" }
celers-kombu = { path = "crates/celers-kombu", version = "0.3.1" }
celers-macros = { path = "crates/celers-macros", version = "0.3.1" }
celers-metrics = { path = "crates/celers-metrics", version = "0.3.1" }
celers-protocol = { path = "crates/celers-protocol", version = "0.3.1" }
celers-worker = { path = "crates/celers-worker", version = "0.3.1" }

# CLI tools
toml = "1.1.4"
tabled = "0.21.0"
colored = "3.1.1"
url = "2.5.8"
ratatui = "0.30.2"
crossterm = "0.29.0"
rustyline = "18.0.1"
csv = "1.4.0"
oxiarc-archive = "0.4.1"
dialoguer = "0.12.0"
dirs = "6.0.0"
urlencoding = "2.1.3"
futures-util = "0.3.34"

# Metrics
prometheus = "0.14.0"
lazy_static = "1.5.0"

# Observability
opentelemetry = { version = "0.32.0", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "rt-tokio"] }
tracing-opentelemetry = "0.33.0"

# Testing
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }
proptest = "1.11.0"
tokio-test = "0.4.5"
tempfile = "3.27.0"
serial_test = "4.0.1"
futures = "0.3.34"
trybuild = "1.0.120"

# Macro dependencies
quote = "1.0.47"
syn = { version = "3.0.4", features = ["full"] }
proc-macro2 = "1.0.107"

# Other utilities
crc32fast = "1.5.1"
rust_decimal = "1.42.1"

[profile.release]
# Enable link-time optimization for smaller binaries
lto = true
# Use a single code generation unit for better optimization
codegen-units = 1
# Strip debug symbols to reduce binary size
strip = true
# Maximum optimization level
opt-level = 3

[profile.release-small]
# Optimize for size rather than speed
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
# Optimize for speed with moderate size
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

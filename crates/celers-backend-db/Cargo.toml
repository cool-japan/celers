[package]
name = "celers-backend-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Database (PostgreSQL/MySQL) result backend for CeleRS"
readme = "README.md"
keywords = ["celery", "database", "backend", "postgresql", "mysql"]
categories = ["asynchronous", "database"]

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

# SQL clients (OxiSQL, Pure Rust) supporting both PostgreSQL and MySQL.
#
# NOTE on feature gating: this crate's `postgres`/`mysql` Cargo features
# (see [features] below) are NOT wired to any `#[cfg(feature = ...)]` in the
# source — `PostgresResultBackend`/`PostgresAnalytics` and
# `MysqlResultBackend`/`MysqlAnalytics` are both compiled unconditionally
# today (confirmed: `grep -n "cfg(feature" src/*.rs` shows only the
# unrelated `distributed-locks` gate on the `lock` module). That was already
# true pre-migration — `sqlx = { workspace = true }` pulled in the
# workspace's `sqlx` with both its `postgres` and `mysql` sqlx-features
# always enabled, regardless of which of *this crate's* `postgres`/`mysql`
# features were selected. `oxisql-postgres`/`oxisql-mysql` are therefore
# kept as required (non-optional) dependencies here too, matching that same
# "always both, unconditionally" shape — making them `optional = true` and
# tying them to `dep:oxisql-postgres`/`dep:oxisql-mysql` would break the
# build the moment only one of `postgres`/`mysql` is selected, since the
# unconditional source code references both crates either way. Introducing
# real `#[cfg(feature = ...)]` gating on the Postgres-only/MySQL-only code
# blocks is a separate, larger change outside this migration's scope.
oxisql-core = { workspace = true }
oxisql-postgres = { workspace = true }
oxisql-mysql = { workspace = true }
oxitls = { workspace = true }
rustls = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }

# Core protocol
celers-core = { workspace = true }
celers-protocol = { workspace = true }

# Re-export types from backend-redis for trait compatibility
celers-backend-redis = { workspace = true }

[features]
default = ["postgres"]
postgres = []
mysql = []
distributed-locks = []

[dev-dependencies]

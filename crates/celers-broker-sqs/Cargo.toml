[package]
name = "celers-broker-sqs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# NOT `rust-version.workspace = true` (which is 1.89). This crate's floor is
# higher and unconditional: `aws-config`, `aws-sdk-sqs` and `aws-sdk-cloudwatch`
# below are plain, non-optional dependencies, and the whole `aws-*` /
# `aws-smithy-*` chain declares `rust-version = "1.94.1"`. There is no feature
# combination of this crate that builds without them, so inheriting the
# workspace floor would be a claim cargo contradicts on the first build.
#
# The consequence propagates: `celers/sqs`, `celers/full` and any
# `--all-features` build of the workspace need 1.94.1 too. Everything else in
# the workspace still builds on 1.89 — see the note in the root manifest.
rust-version = "1.94.1"
description = "AWS SQS broker implementation for CeleRS"
readme = "README.md"
keywords = ["celery", "aws", "sqs", "broker", "cloud"]
categories = ["asynchronous", "network-programming", "web-programming"]

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }

# AWS SDK for SQS
aws-config = { workspace = true }
aws-sdk-sqs = { workspace = true }
aws-sdk-cloudwatch = { workspace = true }

# Pure-Rust HTTPS transport for the AWS SDK (see `src/pure_http.rs` and the
# `[features]` block below). `aws-smithy-runtime-api` is NOT optional: the
# `#[cfg(test)]` `test_support` module needs it whether or not `pure-http` is
# on, and it is already in the graph via `aws-sdk-sqs` regardless.
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true, optional = true }
oxihttp-client = { workspace = true, optional = true }
oxihttp-core = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }

# Compression support
oxiarc-deflate = { workspace = true }
base64 = { workspace = true }

# Stable, toolchain-independent digests for message deduplication keys
sha2 = { workspace = true }
hex = { workspace = true }

# Core dependencies
celers-protocol = { workspace = true }
celers-kombu = { workspace = true }
# The task-queue model `core_broker` adapts this transport onto. Optional so a
# crate that only publishes to SQS keeps the smaller graph; on by default,
# because without it a `celers_worker::Worker` cannot consume from SQS at all.
celers-core = { workspace = true, optional = true }

[features]
# Route every AWS SDK request through `pure_http`, this crate's
# `oxihttp-client`-backed `HttpClient`. On by default, and the only way this
# crate gets HTTPS: the workspace deliberately does not enable
# `aws-config/default-https-client`, because that feature hard-selects
# `aws-smithy-http-client/rustls-aws-lc` -> `aws-lc-sys` (vendored C/C++/asm),
# which `deny.toml` bans.
#
# Turning it off (`default-features = false`) is supported and is the escape
# hatch for a deployment that needs the stock SDK transport — FIPS, a corporate
# proxy, the OS trust store. The application then owns HTTP client selection:
# enable `aws-config/default-https-client` in its own manifest (Cargo unifies
# features across the graph), or pass an `HttpClient` to the SDK itself.
# Without either, the SDK has no transport and every request fails with its own
# "No HTTP client was available to send this request" error. There is no
# in-workspace feature for that fallback on purpose: `deny.toml` runs with
# `[graph] all-features = true`, so any such feature would drag `aws-lc-sys`
# back into the checked graph.
default = ["pure-http", "core-broker"]
# `celers_core::Broker` over this crate's transport (`SqsCoreBroker`), which is
# what lets a `celers_worker::Worker` consume from SQS. See `core_broker`.
core-broker = ["dep:celers-core", "celers-kombu/core-adapter"]
pure-http = [
    "dep:aws-smithy-types",
    "dep:oxihttp-client",
    "dep:oxihttp-core",
    "dep:http",
    "dep:http-body-util",
]

[dev-dependencies]
# `test-util` provides tokio's mock clock (`pause`/`advance`), which is what
# lets interval-driven background loops be tested deterministically instead
# of by sleeping. Test-only: it is inert unless a test pauses the clock.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

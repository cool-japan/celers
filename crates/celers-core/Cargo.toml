[package]
name = "celers-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core traits and types for CeleRS distributed task queue"
readme = "README.md"
keywords = ["celery", "task-queue", "distributed", "async", "traits"]
categories = ["asynchronous", "network-programming"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
num_cpus = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
# `test-util` provides tokio's mock clock (`pause`/`advance`), which lets the
# scheduling, background-flush and retention tests run deterministically instead
# of sleeping on the wall clock. Dev-only: it does not affect the published lib.
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "task_bench"
harness = false

[[bench]]
name = "advanced_bench"
harness = false

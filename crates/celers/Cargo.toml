[package]
name = "celers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Celery-compatible distributed task queue for Rust (Facade crate)"
readme = "README.md"
keywords = ["celery", "task-queue", "distributed", "async", "worker"]
categories = ["asynchronous", "network-programming", "concurrency"]

[dependencies]
# Re-export core functionality
celers-core = { workspace = true }
celers-protocol = { workspace = true }
celers-kombu = { workspace = true }
celers-worker = { workspace = true }
celers-canvas = { workspace = true }
celers-macros = { workspace = true }

# Optional broker implementations
celers-broker-redis = { workspace = true, optional = true }
celers-broker-postgres = { workspace = true, optional = true }
celers-broker-sql = { workspace = true, optional = true }
celers-broker-amqp = { workspace = true, optional = true }
celers-broker-sqs = { workspace = true, optional = true }

# Optional backend implementations
celers-backend-redis = { workspace = true, optional = true }
celers-backend-db = { path = "../celers-backend-db", version = "0.3.1", optional = true }
celers-backend-rpc = { path = "../celers-backend-rpc", version = "0.3.1", optional = true }

# Optional beat scheduler
celers-beat = { workspace = true, optional = true }

# Optional metrics
celers-metrics = { workspace = true, optional = true }

# Core async runtime
tokio = { workspace = true }

# Re-exported types
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

# Optional tracing dependencies
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# Helper dependencies
anyhow = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }

[features]
default = ["redis", "json"]

# Broker features
redis = ["celers-broker-redis"]
postgres = ["celers-broker-postgres"]
mysql = ["celers-broker-sql"]
amqp = ["celers-broker-amqp"]
sqs = ["celers-broker-sqs"]

# Backend features
backend-redis = ["celers-backend-redis"]
backend-db = ["celers-backend-db"]
backend-rpc = ["celers-backend-rpc"]

# Scheduler
beat = ["celers-beat"]
beat-cron = ["beat", "celers-beat/cron"]
beat-solar = ["beat", "celers-beat/solar"]

# Serialization
json = []
msgpack = ["celers-protocol/msgpack"]

# Observability
metrics = ["celers-metrics"]
tracing = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry", "dep:tracing", "dep:tracing-subscriber"]

# Development utilities
dev-utils = []

# Full feature set
full = ["redis", "postgres", "mysql", "amqp", "sqs", "backend-redis", "backend-db", "backend-rpc", "beat", "beat-cron", "beat-solar", "json", "msgpack", "metrics", "tracing", "dev-utils"]

[dev-dependencies]
anyhow = { workspace = true }

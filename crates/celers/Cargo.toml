[package]
name = "celers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Celery-compatible distributed task queue for Rust (Facade crate)"
readme = "README.md"
keywords = ["celery", "task-queue", "distributed", "async", "worker"]
categories = ["asynchronous", "network-programming", "concurrency"]

[dependencies]
# Re-export core functionality
celers-core = { workspace = true }
celers-protocol = { workspace = true }
celers-kombu = { workspace = true }
celers-worker = { workspace = true }
celers-canvas = { workspace = true }
celers-macros = { workspace = true }

# Optional broker implementations
celers-broker-redis = { workspace = true, optional = true }
celers-broker-postgres = { workspace = true, optional = true }
celers-broker-sql = { workspace = true, optional = true }
celers-broker-amqp = { workspace = true, optional = true }
celers-broker-sqs = { workspace = true, optional = true }

# Optional backend implementations
celers-backend-redis = { workspace = true, optional = true }
celers-backend-db = { workspace = true, optional = true }
celers-backend-rpc = { workspace = true, optional = true }

# Optional beat scheduler
celers-beat = { workspace = true, optional = true }

# Optional metrics
celers-metrics = { workspace = true, optional = true }

# Core async runtime
tokio = { workspace = true }

# Re-exported types
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

# Optional tracing dependencies
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# Helper dependencies
anyhow = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }

[features]
default = ["redis", "json"]

# Broker features
redis = ["celers-broker-redis"]
postgres = ["celers-broker-postgres"]
mysql = ["celers-broker-sql"]
amqp = ["celers-broker-amqp"]
sqs = ["celers-broker-sqs"]

# Backend features
#
# `celers-canvas/backend-redis` must be forwarded here: without it the canvas
# crate compiles the always-`Err` 1-argument `Chord::apply(&broker)` stub, so
# there would be no feature combination of this facade in which
# `celers::chord(..)` can actually run. Enabling it swaps in the real
# barrier-synchronised `Chord::apply(&broker, &mut backend)`.
backend-redis = ["celers-backend-redis", "celers-canvas/backend-redis"]
backend-db = ["celers-backend-db"]
backend-rpc = ["celers-backend-rpc"]

# Canvas workflows
#
# Same bug class as `backend-redis` above, on the *consumer* side. The canvas
# primitives themselves are always re-exported (celers-canvas is a hard
# dependency), so a facade user can build a `Chord` or a `Chain` with no
# feature at all — but the half that *finishes* them lives in the worker,
# behind celers-worker's own `canvas` / `workflows` gates: the chord barrier
# and the chain continuation in `celers_worker::worker_core`. Without this
# forwarding a facade user could construct and apply a chord, watch the header
# run, and never see the callback, because the worker they built has the
# barrier compiled out.
#
# `workflows` pulls `backend-redis` too, and must: the barrier is counted in a
# result backend, and `celers-worker/workflows` enables its own
# `celers-backend-redis` regardless — forwarding it here keeps the facade's
# re-exports (`ChordState`, `ResultBackend`) in step with what the worker can
# actually do, instead of enabling a backend the facade cannot name.
canvas = ["celers-worker/canvas"]
workflows = ["canvas", "backend-redis", "celers-worker/workflows"]

# Scheduler
beat = ["celers-beat"]
beat-cron = ["beat", "celers-beat/cron"]
beat-solar = ["beat", "celers-beat/solar"]

# Serialization
json = []
msgpack = ["celers-protocol/msgpack"]

# Observability
metrics = ["celers-metrics"]
tracing = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry", "dep:tracing", "dep:tracing-subscriber"]

# Development utilities
dev-utils = []

# Full feature set
full = ["redis", "postgres", "mysql", "amqp", "sqs", "backend-redis", "backend-db", "backend-rpc", "canvas", "workflows", "beat", "beat-cron", "beat-solar", "json", "msgpack", "metrics", "tracing", "dev-utils"]

[dev-dependencies]
anyhow = { workspace = true }
# `celers_kombu::core_adapter` (the `KombuBrokerAdapter`/`CoreBrokerTransport`
# bridge that makes `AmqpBroker`/`SqsBroker` worker-usable) lives behind
# celers-kombu's `core-adapter` feature. It is off by default and normally
# turns on only as a side effect of enabling this facade's own `amqp`/`sqs`
# features (which pull in `celers-broker-amqp`/`celers-broker-sqs`, whose own
# default features enable it). The end-to-end kombu-bridge test
# (`tests/kombu_bridge_e2e.rs`) needs the adapter over `celers_kombu`'s own
# `MockBroker` — no amqp/sqs broker involved at all — so it requests the
# feature here directly rather than riding on amqp/sqs's coattails. This does
# not change what a downstream consumer of `celers` builds: dev-dependency
# features never leak into a normal `cargo build` of this crate, only into
# `cargo test`/`cargo nextest run`.
celers-kombu = { workspace = true, features = ["core-adapter"] }

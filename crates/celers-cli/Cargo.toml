[package]
name = "celers-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for CeleRS worker and queue management"
readme = "README.md"
keywords = ["celery", "cli", "worker", "queue", "management"]
categories = ["asynchronous", "command-line-utilities"]

[[bin]]
name = "celers"
path = "src/main.rs"

[dependencies]
celers-beat.workspace = true
celers-core = { workspace = true }
celers-worker = { workspace = true }
celers-broker-redis = { workspace = true }
celers-broker-postgres = { workspace = true }
celers-metrics = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
uuid = { workspace = true }
redis = { workspace = true }
chrono = { workspace = true }
oxisql-core = { workspace = true }
oxisql-postgres = { workspace = true }
oxisql-mysql = { workspace = true }
oxitls = { workspace = true }
rustls = { workspace = true }
toml = { workspace = true }
tabled = { workspace = true }
colored = { workspace = true }
oxihttp-client = { workspace = true }
url = { workspace = true }
rustyline = { workspace = true }
csv = { workspace = true }
oxiarc-deflate = { workspace = true }
oxiarc-archive = { workspace = true }
dialoguer = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
# Lets `commands::worker`'s built-in demo tasks (`--demo-tasks`) and the
# integration tests write `#[async_trait] impl Task` as a plain `async fn`
# instead of hand-desugaring the boxed-future signature. Promoted from
# dev-dependencies (test-only) because the demo tasks are production code.
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "serialization"
harness = false
